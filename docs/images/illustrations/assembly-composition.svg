<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title description">
<title id="title">Arrange parts. Build a group.</title>
<desc id="description">House, Tree and Bench Models are added as independent Assembly components, arranged with Move, Rotate and uniform Scale, then saved as an Assembly Group. This diagram does not imply automatic Scene placement.</desc>
<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b30"/>
      <stop offset="1" stop-color="#0c1425"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173b3f"/>
      <stop offset="1" stop-color="#11242f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b8069"/>
      <stop offset="1" stop-color="#205044"/>
    </linearGradient>
    <pattern id="plan-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1e3e52" stroke-width="1"/>
    </pattern>
    <pattern id="scene-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#438775" stroke-width="1" opacity=".24"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m3 2 5 4-5 4" fill="none" stroke="#74ddc3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="tree">
      <path d="M0 2V38" stroke="#b99569" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="3" cy="-4" rx="25" ry="29" fill="#68b78b"/>
      <ellipse cx="-9" cy="-12" rx="19" ry="23" fill="#92d39b"/>
      <path d="M0 5V-19M0-2l-10-8M0-8l11-8" fill="none" stroke="#438b65" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bench">
      <path d="M-23 7v17m40-22v17" stroke="#99b7b5" stroke-width="5" stroke-linecap="round"/>
      <path d="m-30-3 45-17 16 9-45 18z" fill="#d7af78"/>
      <path d="m-30-3 16 10v7L-30 4z" fill="#9c784e"/>
      <path d="m-27-17 43-16v10l-43 16z" fill="#e4bd88"/>
      <path d="m-25-8-2-17M17-23v-12" fill="none" stroke="#99b7b5" stroke-width="4"/>
    </g>
    <g id="house">
      <path d="m-68-4 78 42v76l-78-42z" fill="#d2e4da"/>
      <path d="m10 38 88-47v76l-88 47z" fill="#8fb5ac"/>
      <path d="m-68-4 39-23 39 65z" fill="#e4eee7"/>
      <path d="m-31-29 96-51 45 69-96 51z" fill="#354b60"/>
      <path d="m-76-8 96-51 45-21-96 51z" fill="#547285"/>
      <path d="m-31-29 96-51m-96 51 45 69" fill="none" stroke="#718b99" stroke-width="2"/>
      <path d="m-18 48 18 10v48l-18-10z" fill="#406767"/>
      <path d="m-51 22 23 13v24l-23-13z" fill="#2c686e" stroke="#edf5ed" stroke-width="4"/>
      <path d="m36 39 32-17v28L36 67z" fill="#2c686e" stroke="#dbece2" stroke-width="4"/>
      <path d="m52 30 0 28M36 53l32-17" fill="none" stroke="#dbece2" stroke-width="3"/>
    </g>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #f1f8f5; font-size: 43px; font-weight: 700; letter-spacing: -1px; }
      .heading { fill: #eff8f4; font-size: 23px; font-weight: 600; }
      .body { fill: #aac7ca; font-size: 19px; }
      .small { fill: #a8c5c7; font-size: 17px; }
      .accent { fill: #80dfc5; }
    </style>
  </defs>
<rect width="1280" height="680" rx="24" fill="url(#background)"/>
<rect x="1" y="1" width="1278" height="678" rx="23" fill="none" stroke="#315053"/>
<path d="M42 36h34" stroke="#60d6b4" stroke-width="5" stroke-linecap="round"/>
<text x="90" y="43" class="small accent" font-weight="600" letter-spacing="3">THREED APP</text>
<text x="40" y="106" class="title" >Arrange parts. Build a group.</text>
<text x="40" y="143" class="body" >Compose reusable Models in the Admin Assembly Groups visual editor.</text>
<rect x="40" y="190" width="280" height="370" rx="18" fill="#13242f" stroke="#34525d"/><circle cx="77" cy="227" r="19" fill="#24584f" stroke="#80dfc5"/><text x="77" y="234" class="heading" text-anchor="middle">1</text><text x="108" y="235" class="heading" >Choose Models</text>
<g transform="translate(112 310) scale(0.48)"><use href="#house"/></g><text x="188" y="337" class="body" >House</text>
<g transform="translate(115 400) scale(0.95)"><use href="#tree"/></g><text x="188" y="409" class="body" >Tree</text>
<g transform="translate(112 493) scale(1.1)"><use href="#bench"/></g><text x="188" y="497" class="body" >Bench</text>
<path d="M325 375h35" fill="none" stroke="#74ddc3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="375" y="190" width="470" height="370" rx="18" fill="#13242f" stroke="#34525d"/><circle cx="412" cy="227" r="19" fill="#24584f" stroke="#80dfc5"/><text x="412" y="234" class="heading" text-anchor="middle">2</text><text x="443" y="235" class="heading" >Arrange components</text>
<g transform="translate(602 414) scale(1.15)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g><g transform="translate(560 339) scale(0.76)"><use href="#house"/></g><g transform="translate(703 369) scale(1.05)"><use href="#tree"/></g><g transform="translate(651 465) scale(0.9)"><use href="#bench"/></g>
<g fill="none" stroke-width="3" stroke-linecap="round"><path d="M651 466v-70" stroke="#80dfc5"/><path d="M651 466l70 25" stroke="#75d7f1"/><path d="M651 466l-55 27" stroke="#f4be78"/></g>
<circle cx="651" cy="466" r="6" fill="#f1f8f5"/>
<text x="610" y="535" class="small accent" text-anchor="middle">Move  /  Rotate  /  Uniform Scale</text>
<path d="M850 375h35" fill="none" stroke="#74ddc3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="190" width="340" height="370" rx="18" fill="#13242f" stroke="#34525d"/><circle cx="938" cy="227" r="19" fill="#24584f" stroke="#80dfc5"/><text x="938" y="234" class="heading" text-anchor="middle">3</text><text x="969" y="235" class="heading" >Save the group</text>
<rect x="946" y="286" width="248" height="194" rx="16" fill="#1b3b3d" stroke="#68b99f"/>
<g transform="translate(1046 311)" fill="none" stroke="#94e2c6" stroke-width="4" stroke-linejoin="round"><path d="M0 0h36l12 12v48H0zM10 0v19h25V0M11 60V36h27v24"/></g>
<text x="1070" y="417" class="heading" text-anchor="middle">Courtyard Assembly</text>
<text x="1070" y="451" class="small" text-anchor="middle">3 component placements</text>
<text x="1070" y="535" class="small accent" text-anchor="middle">Reopen and refine</text>
<rect x="40" y="590" width="1200" height="58" rx="12" fill="#12362f" stroke="#2f6b57"/>
<text x="64" y="626" class="body" style="fill:#dcf1e5">Save Changes keeps the Assembly arrangement. The original Models remain available.</text>
</svg>
