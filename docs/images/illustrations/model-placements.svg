<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title description">
<title id="title">One Model. Many placements.</title>
<desc id="description">A reusable Tree Model connects to three distinct Project placements. Each placement has its own position, rotation and scale. Editing a placement does not edit its source Model.</desc>
<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b30"/>
      <stop offset="1" stop-color="#0c1425"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173b3f"/>
      <stop offset="1" stop-color="#11242f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b8069"/>
      <stop offset="1" stop-color="#205044"/>
    </linearGradient>
    <pattern id="plan-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1e3e52" stroke-width="1"/>
    </pattern>
    <pattern id="scene-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#438775" stroke-width="1" opacity=".24"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m3 2 5 4-5 4" fill="none" stroke="#74ddc3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="tree">
      <path d="M0 2V38" stroke="#b99569" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="3" cy="-4" rx="25" ry="29" fill="#68b78b"/>
      <ellipse cx="-9" cy="-12" rx="19" ry="23" fill="#92d39b"/>
      <path d="M0 5V-19M0-2l-10-8M0-8l11-8" fill="none" stroke="#438b65" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bench">
      <path d="M-23 7v17m40-22v17" stroke="#99b7b5" stroke-width="5" stroke-linecap="round"/>
      <path d="m-30-3 45-17 16 9-45 18z" fill="#d7af78"/>
      <path d="m-30-3 16 10v7L-30 4z" fill="#9c784e"/>
      <path d="m-27-17 43-16v10l-43 16z" fill="#e4bd88"/>
      <path d="m-25-8-2-17M17-23v-12" fill="none" stroke="#99b7b5" stroke-width="4"/>
    </g>
    <g id="house">
      <path d="m-68-4 78 42v76l-78-42z" fill="#d2e4da"/>
      <path d="m10 38 88-47v76l-88 47z" fill="#8fb5ac"/>
      <path d="m-68-4 39-23 39 65z" fill="#e4eee7"/>
      <path d="m-31-29 96-51 45 69-96 51z" fill="#354b60"/>
      <path d="m-76-8 96-51 45-21-96 51z" fill="#547285"/>
      <path d="m-31-29 96-51m-96 51 45 69" fill="none" stroke="#718b99" stroke-width="2"/>
      <path d="m-18 48 18 10v48l-18-10z" fill="#406767"/>
      <path d="m-51 22 23 13v24l-23-13z" fill="#2c686e" stroke="#edf5ed" stroke-width="4"/>
      <path d="m36 39 32-17v28L36 67z" fill="#2c686e" stroke="#dbece2" stroke-width="4"/>
      <path d="m52 30 0 28M36 53l32-17" fill="none" stroke="#dbece2" stroke-width="3"/>
    </g>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #f1f8f5; font-size: 43px; font-weight: 700; letter-spacing: -1px; }
      .heading { fill: #eff8f4; font-size: 23px; font-weight: 600; }
      .body { fill: #aac7ca; font-size: 19px; }
      .small { fill: #a8c5c7; font-size: 17px; }
      .accent { fill: #80dfc5; }
    </style>
  </defs>
<rect width="1280" height="680" rx="24" fill="url(#background)"/>
<rect x="1" y="1" width="1278" height="678" rx="23" fill="none" stroke="#315053"/>
<path d="M42 36h34" stroke="#60d6b4" stroke-width="5" stroke-linecap="round"/>
<text x="90" y="43" class="small accent" font-weight="600" letter-spacing="3">THREED APP</text>
<text x="40" y="106" class="title" >One Model. Many placements.</text>
<text x="40" y="143" class="body" >Reuse a catalog Model while arranging each Project instance independently.</text>
<rect x="40" y="190" width="300" height="370" rx="18" fill="#13242f" stroke="#34525d"/>
<text x="64" y="232" class="heading" >Model Library</text>
<text x="64" y="264" class="small" >One reusable Tree Model</text>
<g transform="translate(188 444) scale(0.72)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g><g transform="translate(188 355) scale(2.35)"><use href="#tree"/></g>
<text x="190" y="528" class="small accent" text-anchor="middle">Catalog source</text>
<path d="M346 375H400" fill="none" stroke="#74ddc3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="420" y="190" width="820" height="370" rx="18" fill="url(#project)" stroke="#53bca5" stroke-width="2"/>
<text x="448" y="232" class="heading" >Project placements</text>
<text x="448" y="264" class="small" >Same source. Separate instance identities.</text>
<g transform="translate(590 414) scale(0.85)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g><g transform="translate(840 414) scale(0.85)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g><g transform="translate(1090 414) scale(0.85)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g>
<g transform="translate(590 360) scale(1.45)"><use href="#tree"/></g><g transform="translate(840 341) scale(1.95)"><use href="#tree"/></g><g transform="translate(1090 374) scale(1.1)"><use href="#tree"/></g>
<path d="M792 267h96v170h-96z" fill="none" stroke="#72e5ed" stroke-width="2" stroke-dasharray="6 5"/>
<text x="590" y="491" class="heading" text-anchor="middle">Entrance tree</text>
<text x="840" y="491" class="heading" text-anchor="middle">Courtyard tree</text>
<text x="1090" y="491" class="heading" text-anchor="middle">Garden tree</text>
<text x="840" y="532" class="small accent" text-anchor="middle">Position  /  rotation  /  scale</text>
<rect x="40" y="590" width="1200" height="58" rx="12" fill="#12362f" stroke="#2f6b57"/>
<text x="64" y="626" class="body" style="fill:#dcf1e5">Use DetailsCard to edit a Project placement. Its source Model remains reusable.</text>
</svg>
