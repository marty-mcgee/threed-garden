name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Assets and TypeScript baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production animation assets
        run: npm run validate:assets

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The v0.17.0 repository has a documented pre-existing TypeScript
      # baseline. Keep diagnostics visible without blocking asset-safety work;
      # remove continue-on-error after that baseline is repaired.
      - name: Report TypeScript baseline (non-blocking)
        continue-on-error: true
        run: bun run typecheck
