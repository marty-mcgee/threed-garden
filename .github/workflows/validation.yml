name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Assets and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production animation assets
        run: npm run validate:assets

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Validate Model import contracts
        run: npm run validate:threed-model-import

      - name: Validate Model bulk preparation
        run: npm run validate:threed-model-bulk-preparation

      - name: Validate Model bulk import sequencing
        run: npm run validate:threed-model-bulk-runner

      - name: Validate FBX material targets
        run: npm run validate:threed-fbx-material-targets

      - name: Validate GLB/GLTF bundles
        run: npm run validate:threed-gltf-bundle

      - name: Validate GLB/GLTF material targets
        run: npm run validate:threed-gltf-material-targets

      - name: Validate local Model preview snapshots
        run: npm run validate:threed-model-bulk-preview
