<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Project Albums. One playback overlay.</title>
<desc id="description">Use Multimedia in the Project toolbar to browse assigned Albums and their Tracks. Project Save retains the supported overlay and Album/Track selection; reopen is paused.</desc>
