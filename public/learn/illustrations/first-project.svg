<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Your first Project, in four steps</title>
<desc id="description">Start with a Project you own and one small change you can verify. Public viewing is available; editing and saving require the appropriate ownership.</desc>
<defs>
<linearGradient id="background" x2="1" y2="1">
<stop stop-color="#112d32"/>
<stop offset="1" stop-color="#0b1424"/>
</linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<rect width="20" height="20" fill="#102331"/>
<path d="M20 0H0V20" fill="none" stroke="#244552" stroke-width=".7"/>
</pattern>
</defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="638" rx="24" fill="url(#background)" stroke="#355661"/>
<path d="M40 34L72 34" fill="none" stroke="#67d4b3" stroke-width="4" />
<text x="85" y="40" fill="#67d4b3" font-size="14" font-weight="600">THREED APP / VISUAL GUIDE</text>
<text x="40" y="98" fill="#eef8f6" font-size="36" font-weight="700">Your first Project, in four steps</text>
<text x="40" y="134" fill="#afc8cb" font-size="19" font-weight="400">Start with a Project you own and one small change you can verify.</text>
<circle cx="68" cy="208" r="18" fill="#1d4847" stroke="#67d4b3"/>
<text x="63" y="214" fill="#67d4b3" font-size="18" font-weight="600">1</text>
<text x="98" y="215" fill="#eef8f6" font-size="22" font-weight="600">Create your Project</text>
<circle cx="658" cy="208" r="18" fill="#1d4847" stroke="#67d4b3"/>
<text x="653" y="214" fill="#67d4b3" font-size="18" font-weight="600">2</text>
<text x="688" y="215" fill="#eef8f6" font-size="22" font-weight="600">Draw or place</text>
<rect x="40" y="238" width="528" height="110" rx="18" fill="#122832" stroke="#355661"/>
<text x="62" y="273" fill="#67d4b3" font-size="23" font-weight="600">ThreeD Starter</text>
<g transform="translate(464 263) scale(1.4)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M2 6h8l4 4h16v19H2z"/>
</g>
</g>
<text x="64" y="316" fill="#afc8cb" font-size="20" font-weight="400">Name it, then Create &amp; Open Project.</text>
<rect x="632" y="238" width="528" height="110" rx="18" fill="#122832" stroke="#355661"/>
<text x="654" y="273" fill="#67d4b3" font-size="23" font-weight="600">Design or Model Library</text>
<g transform="translate(1050 261) scale(1.4)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="m16 2 13 8v15l-13 7L3 25V10zM3 10l13 8 13-8M16 18v14M9 6l13 8"/>
</g>
</g>
<text x="656" y="316" fill="#afc8cb" font-size="20" font-weight="400">Try one wall or one placed Model.</text>
<circle cx="68" cy="407" r="18" fill="#1d4847" stroke="#67d4b3"/>
<text x="63" y="413" fill="#67d4b3" font-size="18" font-weight="600">3</text>
<text x="98" y="414" fill="#eef8f6" font-size="22" font-weight="600">Save and wait</text>
<circle cx="658" cy="407" r="18" fill="#1d4847" stroke="#67d4b3"/>
<text x="653" y="413" fill="#67d4b3" font-size="18" font-weight="600">4</text>
<text x="688" y="414" fill="#eef8f6" font-size="22" font-weight="600">Reopen and inspect</text>
<g transform="translate(64 450) scale(1.6)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 3h21l5 5v22H3zM9 3v9h13V3M9 30V19h14v11"/>
</g>
</g>
<text x="142" y="466" fill="#afc8cb" font-size="19" font-weight="400">Wait for the saved confirmation.</text>
<text x="142" y="495" fill="#afc8cb" font-size="19" font-weight="400">Keep the page open if saving fails.</text>
<g transform="translate(658 450) scale(1.6)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M2 6h8l4 4h16v19H2z"/>
</g>
</g>
<text x="734" y="466" fill="#afc8cb" font-size="19" font-weight="400">Return to that same Project.</text>
<text x="734" y="495" fill="#afc8cb" font-size="19" font-weight="400">Check your change is still there.</text>
<rect x="40" y="548" width="1120" height="52" rx="12" fill="#123831" stroke="#2d6557"/>
<g transform="translate(56 561) scale(0.72)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M16 8Q8 2 2 6v22q6-4 14 1 8-5 14-1V6q-6-4-14 2v21"/>
</g>
</g>
<text x="94" y="581" fill="#d2e8df" font-size="19" font-weight="400">Public viewing is available; editing and saving require the appropriate ownership.</text>
<text x="40" y="624" fill="#afc8cb" font-size="13" font-weight="400">Conceptual illustration · follow the guide for the current controls and supported behavior.</text>
</g>
</svg>
