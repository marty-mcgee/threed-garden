<text x="40" y="100" class="title" text-anchor="start">Prepare the Model, not just its picture</text>
<text x="40" y="138" class="body" text-anchor="start">Geometry, supporting files and preview images have different jobs.</text>
<rect x="40" y="178" width="302" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="66" y="219" class="heading" text-anchor="start">Source and support</text>
