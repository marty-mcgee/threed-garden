 <rect x="838" y="248" width="125" height="118" rx="10" fill="#203c44" stroke="#52736f"/><g transform="translate(894 293) scale(0.5)"><use href="#house"/></g><text x="982" y="288" class="small" text-anchor="start">Library</text>
