<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Prepare the Model, not just its picture</title>
<desc id="description">Geometry, Materials and supporting files feed a loaded House Model preview. Separate Library thumbnail and top-down plan image examples illustrate that preview images do not replace geometry.</desc>
<defs>
