<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Select first. Edit the selected object.</title>
<desc id="description">Use the properties supported by that object, then inspect the result in both views. Changing measurement units changes display and input units; it does not resize objects.</desc>
