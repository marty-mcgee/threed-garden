<path d="M40 35h32" stroke="#80dfc5" stroke-width="4" stroke-linecap="round"/>
<text x="86" y="42" class="small accent" text-anchor="start">THREED APP / LEARN</text>
<text x="40" y="100" class="title" text-anchor="start">A design backup has a boundary</text>
<text x="40" y="138" class="body" text-anchor="start">Architecture JSON helps move architectural content between working copies.</text>
<rect x="40" y="178" width="300" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="66" y="219" class="heading" text-anchor="start">Architecture JSON</text><g transform="translate(190 324) scale(1.3)"><use href="#file"/></g><g transform="translate(190 444) scale(0.65)"><use href="#plan"/></g>
 <path d="M347 354h30" fill="none" stroke="#74ddc3" stroke-width="3" marker-end="url(#arrow)"/><rect x="393" y="178" width="377" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="419" y="219" class="heading" text-anchor="start">Review before importing</text>
 <rect x="420" y="255" width="323" height="71" rx="12" fill="#193e40" stroke="#50897a"/><text x="582" y="299" class="heading" text-anchor="middle">Merge architecture</text>
 <text x="582" y="358" class="small" text-anchor="middle">or</text><rect x="420" y="383" width="323" height="71" rx="12" fill="#193e40" stroke="#50897a"/><text x="582" y="427" class="heading" text-anchor="middle">Replace architecture</text>
 <text x="582" y="502" class="small" text-anchor="middle">Check omitted items.</text><path d="M777 354h23" fill="none" stroke="#74ddc3" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="816" y="178" width="344" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="842" y="219" class="heading" text-anchor="start">Project Models stay</text><g transform="translate(988 411) scale(0.85)"><path d="m-150 0 160-80 150 80-160 85z" fill="url(#ground)" stroke="#68ab8d" stroke-width="2"/></g><g transform="translate(970 333) scale(0.95)"><use href="#house"/></g><circle cx="1089" cy="426" r="15" fill="#205448" stroke="#80dfc5"/><path d="m1082 426 5 5 9-10" fill="none" stroke="#c4f5dc" stroke-width="2.5"/>
 <text x="988" y="502" class="small" text-anchor="middle">Then use Project Save.</text>
<rect x="40" y="562" width="1120" height="44" rx="12" fill="#173b32" stroke="#396c59"/>
<text x="60" y="591" class="body accent" text-anchor="start">Architecture JSON is not a full Project backup. Review the scope before accepting an import.</text>
<text x="40" y="629" class="small" text-anchor="start">Conceptual illustration · use the guide for current controls and supported behavior.</text>
</svg>
