<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">A design backup has a boundary</title>
<desc id="description">An architecture JSON file enters import review, where Merge or Replace architecture is chosen and omissions are checked. Project Model placements are shown outside that replacement boundary. The accepted result still needs Project Save.</desc>
<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b30"/>
      <stop offset="1" stop-color="#0c1425"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173b3f"/>
      <stop offset="1" stop-color="#11242f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b8069"/>
      <stop offset="1" stop-color="#205044"/>
    </linearGradient>
    <pattern id="plan-grid" width="22" height="22" patternUnits="userSpaceOnUse">
