<rect x="1" y="1" width="1198" height="638" rx="24" fill="url(#background)" stroke="#36555e"/>
<path d="M40 35h32" stroke="#80dfc5" stroke-width="4" stroke-linecap="round"/>
<text x="86" y="42" class="small accent" text-anchor="start">THREED APP / LEARN</text>
<text x="40" y="100" class="title" text-anchor="start">Manage accounts with clear boundaries</text>
<text x="40" y="138" class="body" text-anchor="start">Super Admins create accounts, save profile changes and manage permitted roles.</text>
<rect x="40" y="178" width="345" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="66" y="219" class="heading" text-anchor="start">Create an account</text><g transform="translate(212 331) scale(1.35)"><use href="#person"/></g><circle cx="267" cy="370" r="15" fill="#205448" stroke="#80dfc5"/><path d="m260 370 5 5 9-10" fill="none" stroke="#c4f5dc" stroke-width="2.5"/>
 <text x="212" y="446" class="body" text-anchor="middle">Enter account details.</text>
<text x="212" y="473" class="body" text-anchor="middle">Save the new User.</text>
 <rect x="427" y="178" width="345" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="453" y="219" class="heading" text-anchor="start">Edit profile or role</text><g transform="translate(600 321) scale(1.2)"><use href="#file"/></g>
 <text x="600" y="446" class="body" text-anchor="middle">Review the intended role.</text>
<text x="600" y="473" class="body" text-anchor="middle">Save changes explicitly.</text>
 <rect x="814" y="178" width="346" height="356" rx="18" fill="#142a35" stroke="#36555e"/><text x="840" y="219" class="heading" text-anchor="start">Protected soft deletion</text><g transform="translate(987 317) scale(1.3)"><use href="#lock"/></g>
 <text x="987" y="418" class="small" text-anchor="middle">Retain the User record.</text>
<text x="987" y="445" class="small" text-anchor="middle">Protect self, last active</text>
<text x="987" y="472" class="small" text-anchor="middle">Super Admin and content owners.</text>
<text x="987" y="499" class="small" text-anchor="middle">Deleted access is blocked.</text>
<rect x="40" y="562" width="1120" height="44" rx="12" fill="#173b32" stroke="#396c59"/>
<text x="60" y="591" class="body accent" text-anchor="start">Users management requires Super Admin access. Deletion protections remain in force.</text>
<text x="40" y="629" class="small" text-anchor="start">Conceptual illustration · use the guide for current controls and supported behavior.</text>
</svg>
