<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Manage accounts with clear boundaries</title>
<desc id="description">A Super Admin path leads to account creation and profile or role editing. A separate protected soft-deletion panel shows a lock and explains that account records are retained and self-deletion, last active Super Admin and content ownership protections apply.</desc>
<defs>
