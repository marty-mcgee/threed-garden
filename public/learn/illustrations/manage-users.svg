<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Accounts keep their content boundaries</title>
<desc id="description">Active Super Admins manage Users. Ordinary Admins manage their own content. Self, last-active-Super-Admin and content-owner deletion checks remain enforced.</desc>
