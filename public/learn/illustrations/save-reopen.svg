</g>
</g>
<text x="634" y="412" fill="#afc8cb" font-size="18" font-weight="400">Read saved feedback.</text>
<text x="634" y="440" fill="#afc8cb" font-size="18" font-weight="400">Keep failed drafts.</text>
<path d="M879 352L892 352" fill="none" stroke="#67d4b3" stroke-width="3" />
<path d="m882 345 10 7-10 7" fill="none" stroke="#67d4b3" stroke-width="3"/>
