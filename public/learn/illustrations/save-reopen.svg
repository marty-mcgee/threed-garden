<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Make a change. Save. Return.</title>
<desc id="description">Explicit Project Save keeps supported content and workspace preferences together. If Save fails, keep the page open, read the error and retry before leaving.</desc>
<defs>
<linearGradient id="background" x2="1" y2="1">
<stop stop-color="#112d32"/>
<stop offset="1" stop-color="#0b1424"/>
</linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<rect width="20" height="20" fill="#102331"/>
<path d="M20 0H0V20" fill="none" stroke="#244552" stroke-width=".7"/>
</pattern>
</defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="638" rx="24" fill="url(#background)" stroke="#355661"/>
<path d="M40 34L72 34" fill="none" stroke="#67d4b3" stroke-width="4" />
<text x="85" y="40" fill="#67d4b3" font-size="14" font-weight="600">THREED APP / VISUAL GUIDE</text>
<text x="40" y="98" fill="#eef8f6" font-size="36" font-weight="700">Make a change. Save. Return.</text>
<text x="40" y="134" fill="#afc8cb" font-size="19" font-weight="400">Explicit Project Save keeps supported content and workspace preferences together.</text>
<rect x="40" y="210" width="262" height="290" rx="18" fill="#122832" stroke="#355661"/>
<text x="62" y="245" fill="#67d4b3" font-size="23" font-weight="600">Make a change</text>
<g transform="translate(130 283) scale(2)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="m16 2 13 8v15l-13 7L3 25V10zM3 10l13 8 13-8M16 18v14M9 6l13 8"/>
</g>
</g>
<text x="62" y="412" fill="#afc8cb" font-size="18" font-weight="400">Edit architecture</text>
<text x="62" y="440" fill="#afc8cb" font-size="18" font-weight="400">or place a Model.</text>
<path d="M307 352L320 352" fill="none" stroke="#67d4b3" stroke-width="3" />
<path d="m310 345 10 7-10 7" fill="none" stroke="#67d4b3" stroke-width="3"/>
<rect x="326" y="210" width="262" height="290" rx="18" fill="#122832" stroke="#355661"/>
<text x="348" y="245" fill="#67d4b3" font-size="23" font-weight="600">Save Project</text>
<g transform="translate(416 283) scale(2)">
<g fill="none" stroke="#67d4b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 3h21l5 5v22H3zM9 3v9h13V3M9 30V19h14v11"/>
</g>
</g>
<text x="348" y="412" fill="#afc8cb" font-size="18" font-weight="400">Use explicit Save.</text>
<text x="348" y="440" fill="#afc8cb" font-size="18" font-weight="400">Wait for its result.</text>
<path d="M593 352L606 352" fill="none" stroke="#67d4b3" stroke-width="3" />
<path d="m596 345 10 7-10 7" fill="none" stroke="#67d4b3" stroke-width="3"/>
<rect x="612" y="210" width="262" height="290" rx="18" fill="#122832" stroke="#355661"/>
<text x="634" y="245" fill="#67d4b3" font-size="23" font-weight="600">Confirm</text>
<g transform="translate(702 283) scale(2)">
