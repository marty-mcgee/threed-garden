<text x="94" y="581" fill="#d2e8df" font-size="19" font-weight="400">If Save fails, keep the page open, read the error and retry before leaving.</text>
<text x="40" y="624" fill="#afc8cb" font-size="13" font-weight="400">Conceptual illustration · follow the guide for the current controls and supported behavior.</text>
